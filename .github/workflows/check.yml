name: VPN Gate Node Check

on:
  # 定时检测: 默认每 30 分钟一次。改成每 60 分钟: cron: "0 * * * *"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 检测 Worker 候选列表, 逗号分隔; 启动时会逐个做健康检查, 自动选可用的那个
          # 旧地址 check.helei.kdns.fr 域名已失效 (DNS 无解析) 导致所有检测失败, 已移除首选位
          CHECK_WORKERS: "https://v2.xk612.ccwu.cc/check?sstp=vpn:vpn@,https://check.helei.kdns.fr/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"
          # Worker 全部不可用时, 降级为 runner 直连 TCP 握手探测 (保证流水线仍有真实结果)
          ALLOW_DIRECT_FALLBACK: "1"

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 修复说明: 旧版 configure-pages@v5 / deploy-pages@v4 / upload-artifact@v4 是 Node 20,
      # 在 Node 24 runner 上被强制运行并产生弃用告警; 统一升级到官方 Node 24 版本。
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'public'

      # 上传完成后, Actions 产物服务的元数据偶尔存在秒级可见性延迟:
      # #167 / #180 中 deploy-pages 在上传 0.25s 后查询到 "Found 0 artifact(s)" 而失败,
      # 但产物其实已经上传成功。先轮询确认元数据可见, 避免竞态。
      - name: Wait for Pages artifact metadata
        run: |
          for i in $(seq 1 12); do
            count=$(curl -fsS \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              | jq -r '.total_count // 0') || count=0
            count=${count:-0}
            if [ "$count" -ge 1 ]; then
              echo "github-pages artifact metadata is visible (attempt $i)"
              exit 0
            fi
            echo "attempt $i/12: artifact metadata not visible yet, waiting 3s"
            sleep 3
          done
          echo "::warning::artifact metadata check timed out; deployment steps will retry"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 即使产物服务短暂抖动, 也通过多次重试让本次运行最终成功, 而不是直接标红。
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before deployment retry
        if: ${{ steps.deployment.outcome == 'failure' }}
        run: |
          echo "首次部署未取到产物元数据, 等待 15s 后重试 (产物服务偶发延迟)"
          sleep 15

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: ${{ steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before final deployment retry
        if: ${{ steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure' }}
        run: |
          echo "产物服务仍未就绪, 再等待 30s 后进行最后一次部署尝试"
          sleep 30

      - name: Deploy to GitHub Pages (final retry)
        id: deployment_final
        if: ${{ steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure' }}
        uses: actions/deploy-pages@v5

      - name: Show site URL
        run: 'echo "site: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_final.outputs.page_url }}"'
